# Defrag engineering blog — Zola
#
# Production origin — must match wrangler.toml [env.production] custom domain.
base_url = "http://127.0.0.1:8765"

title = "Defrag"
description = "Engineering notes from Defrag — tooling, infrastructure and preservation for the Cardano ecosystem. Rust, Mithril, Cloudflare Workers."
default_language = "en"

compile_sass = false
minify_html = false
build_search_index = false

generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]
author = "Damon Oehlman"

taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

[markdown]
render_emoji = false
external_links_target_blank = true
external_links_no_follow = false
smart_punctuation = true
bottom_footnotes = true
insert_anchor_links = "left"

[markdown.highlighting]
# Dark bench — matches the site (always-dark UI).
theme = "github-dark"
style = "inline"
error_on_missing_language = false

[extra]
github_repo = "https://github.com/defrag-au/blog"
github_url = "https://github.com/defrag-au"
operator = "Defrag Pty Ltd"
contact_email = "contact@defrag.au"

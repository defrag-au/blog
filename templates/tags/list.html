{% extends "base.html" %}

{% block title %}Tags — {{ config.title }}{% endblock title %}

{% block content %}
  <h1>Tags</h1>
  <ul class="post-list">
    {% for term in terms %}
    <li>
      <h2><a href="{{ term.permalink }}">{{ term.name }}</a></h2>
      <p class="desc">{{ term.pages | length }} post{% if term.pages | length != 1 %}s{% endif %}</p>
    </li>
    {% endfor %}
  </ul>
{% endblock content %}

# Deploy the Defrag blog Worker (static assets + thin /health entry).
#
# Secrets — defrag-au ORGANIZATION secrets (same names as cnft.dev-workers):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Guard production base_url
        run: grep -qx 'base_url = "https://blog.defrag.au"' config.toml || { echo "config.toml base_url is not production"; exit 1; }

      - name: Install Zola
        run: |
          set -euo pipefail
          VER=v0.23.6
          curl -sL "https://github.com/getzola/zola/releases/download/${VER}/zola-${VER}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv zola /usr/local/bin/
          zola --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (OG share cards)
        run: pip install --quiet "pillow==12.3.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install wrangler
        run: npm ci

      # wrangler [build] → scripts/build.sh (OG cards, then zola build)
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.43.0"
          command: deploy --env production
